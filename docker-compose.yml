services:
  starlette_admin_demo:
    container_name: starlette_admin_demo
    build:
      context: .
      secrets:
        - github_token
    restart: always
    environment:
      UPLOAD_DIR: uploads/
      ENGINE: mysql+pymysql://demo:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@mysql:3306/demo
      APP_ENV: PROD
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      UMAMI_HOST: ${UMAMI_HOST:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    container_name: mysql
    image: mysql:8
    restart: always
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD must be set}
    volumes:
      # - mysql_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - demo
        - -p${MYSQL_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:mysql-latest
    restart: always
    environment:
      DATABASE_URL: mysql://umami:${UMAMI_DB_PASSWORD:?UMAMI_DB_PASSWORD must be set}@mysql:3306/umami
      DATABASE_TYPE: mysql
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET must be set}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

# volumes:
#   mysql_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN
