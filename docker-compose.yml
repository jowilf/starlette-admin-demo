services:
  starlette_admin_demo:
    container_name: starlette_admin_demo
    build:
      context: .
      secrets:
        - github_token
    restart: always
    environment:
      UPLOAD_DIR: uploads/
      ENGINE: mysql+pymysql://demo:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@mysql:3306/demo
      APP_ENV: PROD
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      UMAMI_HOST: ${UMAMI_HOST:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    container_name: mysql
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ./db-init/umami-init.sql
        target: /docker-entrypoint-initdb.d/umami-init.sql
        content: |
          CREATE DATABASE IF NOT EXISTS umami;
          GRANT ALL PRIVILEGES ON umami.* TO 'demo'@'%';
          GRANT SELECT, PROCESS, REPLICATION CLIENT ON *.* TO 'demo'@'%';
          FLUSH PRIVILEGES;
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - demo
        - -p${MYSQL_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:mysql-latest
    restart: always
    environment:
      DATABASE_URL: mysql://demo:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@mysql:3306/umami
      DATABASE_TYPE: mysql
      APP_SECRET: ${UMAMI_APP_SECRET:?UMAMI_APP_SECRET must be set}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  pmm-server:
    container_name: pmm-server
    image: percona/pmm-server:3
    restart: always
    volumes:
      - pmm_data:/srv
    environment:
      PMM_ADMIN_PASSWORD: ${PMM_ADMIN_PASSWORD:?PMM_ADMIN_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "curl -kf https://localhost:8443/v1/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  pmm-client:
    container_name: pmm-client
    image: percona/pmm-client:3
    restart: always
    depends_on:
      pmm-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - pmm_agent_data:/srv
    environment:
      PMM_AGENT_SERVER_ADDRESS: pmm-server:8443
      PMM_AGENT_SERVER_USERNAME: admin
      PMM_AGENT_SERVER_PASSWORD: ${PMM_ADMIN_PASSWORD:?PMM_ADMIN_PASSWORD must be set}
      PMM_AGENT_SERVER_INSECURE_TLS: "1"
      PMM_AGENT_SETUP: "1"
      PMM_AGENT_CONFIG_FILE: config/pmm-agent.yaml
      PMM_AGENT_SETUP_NODE_TYPE: container
      PMM_AGENT_SETUP_NODE_NAME: mysql-demo
      PMM_AGENT_SETUP_METRICS_MODE: push
      PMM_AGENT_PRERUN_SCRIPT: >-
        pmm-admin add mysql
        --username=demo
        --password=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
        --host=mysql
        --port=3306
        --query-source=perfschema
        demo-mysql

volumes:
  mysql_data:
  pmm_data:
  pmm_agent_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN
