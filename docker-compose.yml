services:
  starlette_admin_demo:
    container_name: starlette_admin_demo
    build:
      context: .
      secrets:
        - github_token
    restart: always
    environment:
      UPLOAD_DIR: uploads/
      ENGINE: mysql+pymysql://demo:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@mysql:3306/demo
      APP_ENV: PROD
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      - mysql

  mysql:
    container_name: mysql
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}

secrets:
  github_token:
    environment: GITHUB_TOKEN
