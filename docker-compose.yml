services:
  starlette_admin_demo:
    container_name: starlette_admin_demo
    build:
      context: .
      secrets:
        - github_token
    restart: always
    environment:
      UPLOAD_DIR: uploads/
      ENGINE: mysql+pymysql://demo:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@mysql:3306/demo
      APP_ENV: PROD
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    container_name: mysql
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - demo
        - -p${MYSQL_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

secrets:
  github_token:
    environment: GITHUB_TOKEN
