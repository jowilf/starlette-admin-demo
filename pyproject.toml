[project]
name = "starlette-admin-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "fastapi[standard]>=0.162.0",
    "markdown>=3.11.2",
    "pillow>=13.0.0",
    "sqlalchemy>=2.0.55,<2.1",
    "starlette-admin[i18n,pdf]>=1.0.3",
    "psycopg[binary,pool]>=3.3.6",
    "celery[redis]>=5.6.3",
    "redis>=6.4.0",
    "flower>=2.2.0",
    "sqlalchemy-searchable>=3.0.0",
    "tablib[all]>=3.10.0",
    "greenlet>=3.5.6",
]

[project.scripts]
seed = "starlette_admin_demo.seed:main"
seed-api = "starlette_admin_demo.seed_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "djlint>=1.47.0",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]

[tool.ruff.lint]
ignore = ["RUF012"]

[tool.djlint]
profile = "jinja"

[tool.poe.tasks]
dev = "fastapi dev src/starlette_admin_demo/app.py"
worker = "celery -A starlette_admin_demo.celery_app worker --loglevel=info"
beat = "celery -A starlette_admin_demo.celery_app beat --loglevel=info"
flower = "celery -A starlette_admin_demo.celery_app flower --port=5555"
format.sequence = [
    "ruff format",
    "ruff check . --fix",
    "djlint templates --reformat --format-css --format-js",
]
format.default_item_type = "cmd"
