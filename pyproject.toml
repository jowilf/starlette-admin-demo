[project]
name = "starlette-admin-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.28.1",
    "fastapi[standard]>=0.139.0",
    "markdown>=3.10.2",
    "pillow>=12.3.0",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0.51",
    "starlette-admin",
]

[project.scripts]
seed = "starlette_admin_demo.seed:main"
seed-api = "starlette_admin_demo.seed_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["poethepoet>=0.48.0", "pre-commit>=4.6.0", "ruff>=0.15.21"]

[tool.poe.tasks]
format.sequence = ["ruff format", "ruff check . --fix"]
format.default_item_type = "cmd"

[tool.uv.sources]
starlette-admin = { git = "https://github.com/jowilf/starlette-admin-next.git", rev = "0bbb350a35f08a45ecfd7ccb33e4ad6ac9d28d41" }
