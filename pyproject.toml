[project]
name = "starlette-admin-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.28.1",
    "fastapi[standard]>=0.139.0",
    "markdown>=3.10.2",
    "pillow>=12.3.0",
    "sqlalchemy>=2.0.51",
    "starlette-admin[i18n,pdf]==1.0.0",
    "psycopg[binary,pool]>=3.3.4",
    "celery[redis]>=5.6.3",
    "redis>=6.4.0",
    "flower>=2.0.1",
    "sqlalchemy-searchable>=3.0.0",
    "tablib[all]>=3.9.0",
]

[project.scripts]
seed = "starlette_admin_demo.seed:main"
seed-api = "starlette_admin_demo.seed_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "djlint>=1.40.8",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.21",
]

[tool.djlint]
profile = "jinja"

[tool.poe.tasks]
dev = "fastapi dev src/starlette_admin_demo/app.py"
worker = "celery -A starlette_admin_demo.celery_app worker --loglevel=info"
beat = "celery -A starlette_admin_demo.celery_app beat --loglevel=info"
flower = "celery -A starlette_admin_demo.celery_app flower --port=5555"
format.sequence = [
    "ruff format",
    "ruff check . --fix",
    "djlint templates --reformat --format-css --format-js",
]
format.default_item_type = "cmd"
